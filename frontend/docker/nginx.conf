# One origin for the SPA and Django, as the Vite dev proxy does: /api/, /admin/ and
# /health/ go to gunicorn with the browser's Host (including the port) so Django's
# ALLOWED_HOSTS, login `next` and CSRF Origin checks see the address in the browser.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at 5 MB by Django; let it return its own FILE_SIZE_LIMIT error.
    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/(api|admin|health)(/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # collectstatic output from the API image (DRF login page, admin).
    location /static/ {
        alias /usr/share/nginx/django-static/;
    }

    # Vite emits content-hashed file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
