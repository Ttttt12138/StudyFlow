        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
components:
  schemas:
    Allocation:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        fx_quote_id:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - source_id
    ApplicationAction:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/ApplicationActionActionEnum'
      required:
      - action
      - expected_version
    ApplicationActionActionEnum:
      enum:
      - submit
      - cancel
      type: string
      description: |-
        * `submit` - submit
        * `cancel` - cancel
    ApplicationInput:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
      required:
      - quote_id
    ApplyInput:
      type: object
      properties:
        confirmation:
          type: string
          maxLength: 2000
      required:
      - confirmation
    ApprovalDecisionInput:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecisionInputDecisionEnum'
        note:
          type: string
          default: ''
          maxLength: 500
        expected_version:
          type: integer
          minimum: 1
      required:
      - decision
      - expected_version
    ApprovalDecisionInputDecisionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    ApprovalInput:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/PolicyActionEnum'
        target_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
        currency:
          $ref: '#/components/schemas/SupportedCurrencyEnum'
        reason:
          type: string
          default: ''
          maxLength: 500
      required:
      - action
      - amount
      - currency
      - target_id
    AssessmentDetails:
      type: object
      properties:
        available_funds:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        funds_currency:
          type: string
          maxLength: 3
        reserve:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        as_of:
          type: string
          format: date
        horizon:
          allOf:
          - $ref: '#/components/schemas/HorizonEnum'
          default: 90
        payment_date:
          type: string
          format: date
          nullable: true
        supports:
          type: array
          items:
            $ref: '#/components/schemas/SupportInput'
        costs:
          type: array
          items:
            $ref: '#/components/schemas/CostOverrideInput'
        repayment:
          $ref: '#/components/schemas/PlanningRecurringInput'
        loan:
          $ref: '#/components/schemas/LoanTermsInput'
        borrower:
          allOf:
          - $ref: '#/components/schemas/BorrowerEnum'
          default: student_with_parent
      required:
      - as_of
      - available_funds
      - funds_currency
      - loan
      - repayment
      - reserve
    AssessmentInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        plan_version:
          type: integer
          minimum: 1
        inputs:
          $ref: '#/components/schemas/AssessmentDetails'
        draft:
          type: boolean
          default: false
      required:
      - expected_version
      - inputs
      - plan_version
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    AuthorizationInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        expires_in_seconds:
          type: integer
          maximum: 3600
          minimum: 60
          default: 900
      required:
      - state_version
    BalanceInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        as_of:
          type: string
          format: date
      required:
      - amount
      - as_of
      - state_version
    BeneficiaryInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        destination_label:
          type: string
          maxLength: 150
      required:
      - destination_label
      - name
    BeneficiaryUpdateInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        name:
          type: string
          maxLength: 150
        destination_label:
          type: string
          maxLength: 150
      required:
      - destination_label
      - name
      - state_version
    BlankEnum:
      enum:
      - ''
    BorrowerEnum:
      enum:
      - student_with_parent
      - parent
      type: string
      description: |-
        * `student_with_parent` - student_with_parent
        * `parent` - parent
    ChooseInput:
      type: object
      properties:
        school_key:
          type: string
          maxLength: 60
        years:
          type: number
          format: double
          maximum: 6
          minimum: 1
      required:
      - school_key
    ClockInput:
      type: object
      properties:
        date:
          type: string
          format: date
      required:
      - date
    CommandResponse:
      type: object
      properties:
        data: {}
      required:
      - data
    CompareInput:
      type: object
      properties:
        loan_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 2
      required:
      - loan_ids
    ComparisonInput:
      type: object
      properties:
        quote_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 2
        source_currency:
          $ref: '#/components/schemas/ComparisonInputSourceCurrencyEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        required_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        send_on:
          type: string
          format: date
        deadline:
          type: string
          format: date
      required:
      - amount
      - deadline
      - quote_ids
      - required_amount
      - send_on
      - source_currency
    ComparisonInputSourceCurrencyEnum:
      enum:
      - USD
      - EUR
      - CNY
      - GBP
      - JPY
      - AUD
      - SGD
      - MYR
      type: string
      description: |-
        * `USD` - USD
        * `EUR` - EUR
        * `CNY` - CNY
        * `GBP` - GBP
        * `JPY` - JPY
        * `AUD` - AUD
        * `SGD` - SGD
        * `MYR` - MYR
    ConfirmInput:
      type: object
      properties:
        selected_rows:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 10000
          minItems: 1
        keep_similar_rows:
          type: array
          items:
            type: string
            maxLength: 40
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/CoverageInput'
      required:
      - coverage
      - selected_rows
    ConfirmPlanningPlan:
      type: object
      description: Confirm the plan; quote_id is the simulated loan to apply for at
        the same time, or null for no loan.
      properties:
        expected_version:
          type: integer
          minimum: 0
        plan_version:
          type: integer
          minimum: 1
        quote_id:
          type: string
          format: uuid
          nullable: true
      required:
      - expected_version
      - plan_version
    ConfirmationInput:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
        draft: {}
        issuer:
          type: string
          maxLength: 200
        selected_cost_ids:
          type: array
          items:
            type: string
            maxLength: 100
        conflict_resolutions:
          type: object
          additionalProperties:
            type: string
            maxLength: 2000
      required:
      - budget_version
      - draft
      - issuer
      - selected_cost_ids
      - semester_id
      - state_version
    ConversationInput:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/LocaleEnum'
    ConversionInput:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
        source_amount:
          type: string
          format: decimal
        state_version:
          type: integer
          minimum: 1
      required:
      - quote_id
      - source_amount
      - state_version
    CostOverrideInput:
      type: object
      properties:
        cost_id:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        paid:
          type: boolean
          default: false
      required:
      - cost_id
    CoverageInput:
      type: object
      properties:
        account_id:
          type: string
          maxLength: 150
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        complete:
          type: boolean
          default: false
      required:
      - account_id
      - end
      - start
    CreditPayInput:
      type: object
      properties:
        source_key:
          type: string
          maxLength: 100
        expected_token:
          type: string
          maxLength: 64
      required:
      - expected_token
      - source_key
    CreditStatementInput:
      type: object
      properties:
        snapshot_id:
          type: string
          format: uuid
      required:
      - snapshot_id
    DecisionInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
      required:
      - expected_version
      - reason
    DomainActionEnum:
      enum:
      - confirm_material
      - transcribe
      - authorize_ocr
      - decide_loan
      - verify_beneficiary
      - reconcile_payment
      type: string
      description: |-
        * `confirm_material` - confirm_material
        * `transcribe` - transcribe
        * `authorize_ocr` - authorize_ocr
        * `decide_loan` - decide_loan
        * `verify_beneficiary` - verify_beneficiary
        * `reconcile_payment` - reconcile_payment
    EmailOtpPurposeEnum:
      enum:
      - sign_up
      - sign_in
      - password_reset
      type: string
      description: |-
        * `sign_up` - Sign up
        * `sign_in` - Sign in
        * `password_reset` - Password reset
    Event:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        certainty:
          $ref: '#/components/schemas/EventCertaintyEnum'
        source_id:
          type: string
          format: uuid
          nullable: true
        beneficiary_id:
          type: string
          format: uuid
          nullable: true
        settled_sequence:
          type: integer
          minimum: 1
        evidence_note:
          type: string
          maxLength: 2000
      required:
      - amount
      - certainty
      - date
      - id
      - kind
      - label
    EventCertaintyEnum:
      enum:
      - confirmed
      - estimated
      - missing
      type: string
      description: |-
        * `confirmed` - confirmed
        * `estimated` - estimated
        * `missing` - missing
    EventKindEnum:
      enum:
      - expense
      - income
      type: string
      description: |-
        * `expense` - expense
        * `income` - income
    ExpenseInput:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        category:
          $ref: '#/components/schemas/ExpenseInputCategoryEnum'
        note:
          type: string
          maxLength: 200
        spent_on:
          type: string
          format: date
      required:
      - amount
    ExpenseInputCategoryEnum:
      enum:
      - food
      - transport
      - housing
      - study
      - shopping
      - fun
      - health
      - other
      type: string
      description: |-
        * `food` - food
        * `transport` - transport
        * `housing` - housing
        * `study` - study
        * `shopping` - shopping
        * `fun` - fun
        * `health` - health
        * `other` - other
    ExpenseOverride:
      type: object
      properties:
        event_id:
          type: string
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        currency:
          allOf:
          - $ref: '#/components/schemas/SupportedCurrencyEnum'
          default: THB
        fx_quote_id:
          type: string
          format: uuid
          nullable: true
        certainty:
          $ref: '#/components/schemas/EventCertaintyEnum'
      required:
      - amount
      - certainty
      - event_id
    ExplanationInput:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
      required:
      - scenario_id
    FXInput:
      type: object
      properties:
        route_name:
          type: string
          default: Simulated route
          maxLength: 100
        settlement_min_days:
          type: integer
          maximum: 60
          minimum: 0
          default: 0
        source_currency:
          $ref: '#/components/schemas/SupportedCurrencyEnum'
        target_currency:
          allOf:
          - $ref: '#/components/schemas/SupportedCurrencyEnum'
          default: THB
        corridor_id:
          type: string
          format: uuid
          nullable: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,10})?$
        sender_fee:
          type: string
          format: decimal
        receiver_fee:
          type: string
          format: decimal
        settlement_days:
          type: integer
          maximum: 60
          minimum: 0
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - rate
      - receiver_fee
      - sender_fee
      - settlement_days
      - source_currency
    ForecastInput:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
        horizon:
          allOf:
          - $ref: '#/components/schemas/HorizonEnum'
          default: 90
        conditional:
          type: boolean
          default: false
      required:
      - budget_version
      - semester_id
      - state_version
    ForecastRequest:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        end_date:
          type: string
          format: date
        include_estimates:
          type: boolean
          default: false
      required:
      - end_date
      - state_version
    ForecastResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state_version:
          type: integer
        engine_version:
          type: string
        result: {}
      required:
      - engine_version
      - id
      - result
      - state_version
    FundingCertaintyEnum:
      enum:
      - confirmed
      - estimated
      type: string
      description: |-
        * `confirmed` - confirmed
        * `estimated` - estimated
    FundingInput:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
        allocations:
          type: array
          items: {}
          maxItems: 50
        actions:
          type: array
          items: {}
          maxItems: 20
      required:
      - budget_version
      - semester_id
      - state_version
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    HistoryResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items: {}
      required:
      - count
      - next
      - previous
      - results
    HorizonEnum:
      enum:
      - 30
      - 60
      - 90
      type: integer
      description: |-
        * `30` - 30
        * `60` - 60
        * `90` - 90
    InitializeInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
      required:
      - state_version
    LanguageEnum:
      enum:
      - en
      - zh
      - zh-en
      type: string
      description: |-
        * `en` - en
        * `zh` - zh
        * `zh-en` - zh-en
    LiveQuoteInput:
      type: object
      properties:
        corridor_id:
          type: string
          format: uuid
        send_amount:
          type: string
          format: decimal
      required:
      - corridor_id
      - send_amount
    LoanDocumentInput:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        done:
          type: boolean
        expected_version:
          type: integer
          minimum: 1
      required:
      - done
      - expected_version
      - task_id
    LoanInput:
      type: object
      properties:
        product:
          allOf:
          - $ref: '#/components/schemas/ProductEnum'
          default: custom
        currency:
          allOf:
          - $ref: '#/components/schemas/SettlementCurrencyEnum'
          default: THB
        principal:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        annual_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
        fees:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        months:
          type: integer
          maximum: 60
          minimum: 1
        first_due_date:
          type: string
          format: date
      required:
      - annual_rate
      - fees
      - first_due_date
      - months
      - principal
    LoanPreviewInput:
      type: object
      description: Instant repayment figures while the amount or term is being chosen;
        nothing is stored.
      properties:
        principal:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        months:
          $ref: '#/components/schemas/MonthsEnum'
        product:
          allOf:
          - $ref: '#/components/schemas/ProductEnum'
          default: custom
      required:
      - months
      - principal
    LoanTermsInput:
      type: object
      properties:
        product:
          allOf:
          - $ref: '#/components/schemas/ProductEnum'
          default: custom
        principal:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        annual_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
          default: '0.06000000'
        fees:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          default: '0.00'
        first_due_date:
          type: string
          format: date
        months:
          allOf:
          - $ref: '#/components/schemas/MonthsEnum'
          default: 48
        periods:
          type: array
          items:
            type: integer
            maximum: 60
            minimum: 1
          maxItems: 3
          minItems: 1
      required:
      - first_due_date
    LocaleEnum:
      enum:
      - zh
      - en
      type: string
      description: |-
        * `zh` - zh
        * `en` - en
    MessageInput:
      type: object
      properties:
        text:
          type: string
          maxLength: 2000
      required:
      - text
    MonthInput:
      type: object
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        living_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        existing_repayments:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
      required:
      - month
    MonthsEnum:
      enum:
      - 24
      - 36
      - 48
      - 60
      type: integer
      description: |-
        * `24` - 24
        * `36` - 36
        * `48` - 48
        * `60` - 60
    OcrConsentInput:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
        ocr_consent:
          type: boolean
          default: false
        ocr_notice_version:
          type: string
          maxLength: 50
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: zh-en
      required:
      - budget_version
      - semester_id
      - state_version
    OrderEventInput:
