      - text
    UndoExpenseInput:
      type: object
      properties:
        expense_id:
          type: string
          format: uuid
      required:
      - expense_id
    UploadInput:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
        ocr_consent:
          type: boolean
          default: false
        ocr_notice_version:
          type: string
          maxLength: 50
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: zh-en
        kind:
          $ref: '#/components/schemas/UploadInputKindEnum'
        file:
          type: string
          format: uri
      required:
      - budget_version
      - file
      - kind
      - semester_id
      - state_version
    UploadInputKindEnum:
      enum:
      - text
      - pdf
      - image
      type: string
      description: |-
        * `text` - text
        * `pdf` - pdf
        * `image` - image
    VerifyInput:
      type: object
      properties:
        verified:
          type: boolean
      required:
      - verified
    VersionInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    Versions:
      type: object
      properties:
        analysis_version:
          type: integer
          minimum: 0
        state_version:
          type: integer
          minimum: 1
        budget_version:
          type: integer
          minimum: 1
        semester_id:
          type: string
          format: uuid
      required:
      - budget_version
      - semester_id
      - state_version
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
