                $ref: '#/components/schemas/CommandResponse'
          description: ''
  /api/v2/state/:
    get:
      operationId: get_api_v2_state
      tags:
      - api
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
          description: ''
    post:
      operationId: post_api_v2_state
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StateWrite'
          multipart/form-data:
