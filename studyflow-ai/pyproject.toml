[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studyflow-ai"
version = "0.2.0"
description = "StudyFlow C: evidence-aware ingestion, routing and candidate planning"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pypdf>=5,<7", "openai>=2,<3", "typesafe-sdk>=0.1,<2", "tzdata>=2025.1", "Babel>=2.17,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2"]
http = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20"]

[project.scripts]
studyflow-ai = "studyflow_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"studyflow_ai.data" = ["*.csv", "*.txt", "*.json", "*.pdf"]

[tool.pytest.ini_options]
testpaths = ["auto_test"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
