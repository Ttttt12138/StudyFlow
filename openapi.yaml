components:
  schemas:
    ActionEnum:
      enum:
      - submit
      - cancel
      type: string
      description: |-
        * `submit` - submit
        * `cancel` - cancel
    Allocation:
      type: object
      properties:
        source_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        fx_quote_id:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - source_id
    ApplicationAction:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/ActionEnum'
      required:
      - action
      - expected_version
    ApplicationInput:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
      required:
      - quote_id
    AuthorizationInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        expires_in_seconds:
          type: integer
          maximum: 3600
          minimum: 60
          default: 900
      required:
      - state_version
    BeneficiaryInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        destination_label:
          type: string
          maxLength: 150
      required:
      - destination_label
      - name
    ClockInput:
      type: object
      properties:
        date:
          type: string
          format: date
      required:
      - date
    CommandResponse:
      type: object
      properties:
        data: {}
      required:
      - data
    CompareInput:
      type: object
      properties:
        loan_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 2
      required:
      - loan_ids
    DecisionInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
      required:
      - expected_version
      - reason
    Event:
      type: object
      properties:
        id:
          type: string
          maxLength: 100
        label:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/EventKindEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        certainty:
          $ref: '#/components/schemas/EventCertaintyEnum'
        source_id:
          type: string
          format: uuid
          nullable: true
        beneficiary_id:
          type: string
          format: uuid
          nullable: true
        settled_sequence:
          type: integer
          minimum: 1
        evidence_note:
          type: string
          maxLength: 2000
      required:
      - amount
      - certainty
      - date
      - id
      - kind
      - label
    EventCertaintyEnum:
      enum:
      - confirmed
      - estimated
      - missing
      type: string
      description: |-
        * `confirmed` - confirmed
        * `estimated` - estimated
        * `missing` - missing
    EventKindEnum:
      enum:
      - expense
      - income
      type: string
      description: |-
        * `expense` - expense
        * `income` - income
    ExpenseOverride:
      type: object
      properties:
        event_id:
          type: string
          maxLength: 100
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        currency:
          allOf:
          - $ref: '#/components/schemas/SupportedCurrencyEnum'
          default: THB
        fx_quote_id:
          type: string
          format: uuid
          nullable: true
        certainty:
          $ref: '#/components/schemas/EventCertaintyEnum'
      required:
      - amount
      - certainty
      - event_id
    ExplanationInput:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
      required:
      - scenario_id
    FXInput:
      type: object
      properties:
        source_currency:
          $ref: '#/components/schemas/SupportedCurrencyEnum'
        target_currency:
          allOf:
          - $ref: '#/components/schemas/SettlementCurrencyEnum'
          default: THB
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,10})?$
        sender_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        receiver_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        settlement_days:
          type: integer
          maximum: 60
          minimum: 0
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - rate
      - receiver_fee
      - sender_fee
      - settlement_days
      - source_currency
    ForecastRequest:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        end_date:
          type: string
          format: date
        include_estimates:
          type: boolean
          default: false
      required:
      - end_date
      - state_version
    ForecastResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state_version:
          type: integer
        engine_version:
          type: string
        result: {}
      required:
      - engine_version
      - id
      - result
      - state_version
    FundingCertaintyEnum:
      enum:
      - confirmed
      - estimated
      type: string
      description: |-
        * `confirmed` - confirmed
        * `estimated` - estimated
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    HistoryResponse:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items: {}
      required:
      - count
      - next
      - previous
      - results
    InitializeInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
      required:
      - state_version
    LoanInput:
      type: object
      properties:
        currency:
          allOf:
          - $ref: '#/components/schemas/SettlementCurrencyEnum'
          default: THB
        principal:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        annual_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,8})?$
        fees:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        months:
          type: integer
          maximum: 60
          minimum: 1
        first_due_date:
          type: string
          format: date
      required:
      - annual_rate
      - fees
      - first_due_date
      - months
      - principal
    MonthInput:
      type: object
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        living_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
        existing_repayments:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          nullable: true
      required:
      - month
    OutcomeEnum:
      enum:
      - settled
      - failed
      - unknown
      type: string
      description: |-
        * `settled` - settled
        * `failed` - failed
        * `unknown` - unknown
    PaginatedSourceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    PaymentEventInput:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
      required:
      - outcome
    PaymentInput:
      type: object
      properties:
        plan_id:
          type: string
          format: uuid
        beneficiary_id:
          type: string
          format: uuid
        event_id:
          type: string
          maxLength: 100
      required:
      - beneficiary_id
      - event_id
      - plan_id
    PlanInput:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
      required:
      - allocations
      - scenario_id
    ProfileInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthInput'
      required:
      - expected_version
      - months
    ReceiveInput:
      type: object
      properties:
        fx_quote_id:
          type: string
          format: uuid
          nullable: true
    RepaymentInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        installment_number:
          type: integer
          maximum: 384
          minimum: 1
      required:
      - expected_version
      - installment_number
    ScenarioInput:
      type: object
      properties:
        state_version:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/ScenarioInputKindEnum'
        end_date:
          type: string
          format: date
        include_estimates:
          type: boolean
          default: false
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseOverride'
      required:
      - end_date
      - kind
      - state_version
    ScenarioInputKindEnum:
      enum:
      - essential
      - expected
      - higher_cost
      type: string
      description: |-
        * `essential` - essential
        * `expected` - expected
        * `higher_cost` - higher_cost
    SettlementCurrencyEnum:
      enum:
      - THB
      type: string
      description: '* `THB` - THB'
    Snapshot:
      type: object
      properties:
        currency:
          $ref: '#/components/schemas/SettlementCurrencyEnum'
        as_of:
          type: string
          format: date
        opening_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        reserve:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      required:
      - as_of
      - currency
      - events
      - opening_balance
      - reserve
    Source:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/SourceKindEnum'
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        note:
          type: string
          maxLength: 4000
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - title
    SourceInput:
      type: object
      properties:
        economic_key:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/SourceInputKindEnum'
        currency:
          $ref: '#/components/schemas/SupportedCurrencyEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        available_on:
          type: string
          format: date
        certainty:
          $ref: '#/components/schemas/FundingCertaintyEnum'
        already_in_opening:
          type: boolean
          default: false
        loan_id:
          type: string
          format: uuid
          nullable: true
      required:
      - amount
      - available_on
      - certainty
      - currency
      - economic_key
      - kind
    SourceInputKindEnum:
      enum:
      - family
      - scholarship
      - external_savings
      - loan
      type: string
      description: |-
        * `family` - family
        * `scholarship` - scholarship
        * `external_savings` - external_savings
        * `loan` - loan
    SourceKindEnum:
      enum:
      - upload
      - official_url
      - import
      type: string
      description: |-
        * `upload` - Upload
        * `official_url` - Official URL
        * `import` - Import
    StateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        snapshot:
          $ref: '#/components/schemas/Snapshot'
      required:
      - id
      - snapshot
      - version
    StateWrite:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
        snapshot:
          $ref: '#/components/schemas/Snapshot'
      required:
      - expected_version
      - snapshot
    SupportedCurrencyEnum:
      enum:
      - THB
      - USD
      - EUR
      - CNY
      - GBP
      - JPY
      type: string
      description: |-
        * `THB` - THB
        * `USD` - USD
        * `EUR` - EUR
        * `CNY` - CNY
        * `GBP` - GBP
        * `JPY` - JPY
    VerifyInput:
      type: object
      properties:
        verified:
          type: boolean
      required:
      - verified
    VersionInput:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
  securitySchemes:
    cookieAuth:
      type: apiKey
