name: studyflow-b
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-simulation-only}
      POSTGRES_DB: studyflow_b
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - lending_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow -d studyflow_b"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://studyflow:${POSTGRES_PASSWORD:-local-simulation-only}@db:5432/studyflow_b
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn studyflow_backend.api:create_app --factory --host 0.0.0.0 --port 8000"]
volumes:
  lending_data:
