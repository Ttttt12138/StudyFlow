name: Student frontend integration
# Pushes to the main branch and pull requests; a newer commit cancels the older run of the same ref.
on:
  push:
    branches: [feature/bc-integration]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studyflow
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: local-simulation-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyflow -d studyflow"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DB_NAME: studyflow
      DB_USER: studyflow
      DB_PASSWORD: local-simulation-only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      STUDYFLOW_READINESS_ENABLED: "true"
      STUDYFLOW_CONSUMPTION_ENABLED: "true"
      STUDYFLOW_MODE: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browser suites call the backend through the repository's .venv (frontend/tests/support.mjs).
      - name: Prepare backend (B)
        run: |
          python -m venv .venv
          cd backend
          ../.venv/bin/python -m pip install -r requirements-dev.txt
          ../.venv/bin/python manage.py migrate --noinput
          ../.venv/bin/python manage.py createcachetable
      - name: Build frontend (A)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start Django and the readiness worker
        run: |
          mkdir -p output/frontend
          (cd backend && exec ../.venv/bin/python manage.py runserver 127.0.0.1:8000 --noreload) > output/frontend/django.log 2>&1 &
          echo $! > output/frontend/django.pid
          (cd backend && exec ../.venv/bin/python manage.py readiness_worker --mode mock) > output/frontend/worker.log 2>&1 &
          echo $! > output/frontend/worker.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/health/ \
              && kill -0 "$(cat output/frontend/worker.pid)"; then exit 0; fi
            sleep 1
          done
          tail -n 50 output/frontend/*.log
          exit 1
      - name: Unit tests and browser suites (Playwright starts Vite)
        working-directory: frontend
        run: |
          npm test
          npm run test:integration
          npm run test:wallet-integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: student-frontend-validation
          path: output/frontend/
          retention-days: 14
