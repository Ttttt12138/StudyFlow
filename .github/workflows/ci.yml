name: C module checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: studyflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src auto_test scripts
      - run: python -m pytest --cov=studyflow_ai
      - run: python -m studyflow_ai --mode mock demo --output output/demo.json
      - run: python -m studyflow_ai --mode mock readiness-demo --output output/readiness-demo.json
      - run: python -m studyflow_ai --mode mock readiness-evaluate --split test --output output/readiness-evaluation-smoke.json
