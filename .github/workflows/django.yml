name: Django B and C integration
# Pushes to the main branch and pull requests; a newer commit cancels the older run of the same ref.
on:
  push:
    branches: [feature/bc-integration, integration/abc]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studyflow
          POSTGRES_USER: studyflow
          POSTGRES_PASSWORD: local-simulation-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyflow -d studyflow"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      DB_NAME: studyflow
      DB_USER: studyflow
      DB_PASSWORD: local-simulation-only
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python scripts/i18n_messages.py check
      - name: Deployment checks with production hardening
        run: |
          DJANGO_SECURE=true DJANGO_DEBUG=False \
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test finance auto_test --noinput
      - run: python -m pytest auto_test/test_lending_core.py -q
      - run: mkdir -p output
      - run: python manage.py spectacular --validate --fail-on-warn --file output/openapi.yaml
      - name: Committed OpenAPI contract matches the code
        run: diff -u openapi.yaml output/openapi.yaml
      - run: python manage.py migrate --noinput
      # Throttle counters use the database cache.
      - run: python manage.py createcachetable
      - run: python manage.py demo_bc --runs 3
      - run: python manage.py demo_readiness --mode mock --runs 3 --output output/readiness-http-mock.json
      - run: python manage.py demo_consumption --runs 3 --output output/consumption-http-demo.json
      - run: python manage.py demo_copilot --mode mock --runs 3 --output output/copilot-http-demo.json
      - run: python manage.py demo_remittance --runs 3 --output output/remittance-http-demo.json
      - run: python manage.py demo_agent --runs 3 --output output/agent-http-demo.json
      - run: python manage.py evaluate_agent --mode mock --min-success 1.0 --output output/agent-eval.json
