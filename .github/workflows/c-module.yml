name: C module checks
# Pushes to the main branch and pull requests; a newer commit cancels the older run of the same ref.
on:
  push:
    branches: [feature/bc-integration]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.13']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studyflow-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src auto_test scripts
      - run: python -m pytest --cov=studyflow_ai
      - run: python -m studyflow_ai --mode mock demo --output output/demo.json
      - run: python -m studyflow_ai --mode mock readiness-demo --output output/readiness-demo.json
      - run: python -m studyflow_ai --mode mock readiness-evaluate --split test --output output/readiness-evaluation-smoke.json
